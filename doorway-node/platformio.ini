; PlatformIO Project Configuration File
;
; One firmware tree, one env per physical node. The env selects that node's
; committed install constants (src/node_config_XX.h) via NODE_CONFIG_FILE.
;
;   pio run -e node01 -t upload    # build + flash node 1
;   pio run -e node02 -t upload    # build + flash node 2
;
; A bare `pio run` builds every env. Adding a node = new node_config_XX.h +
; new [env:nodeXX] below. Each env gets its own generated sdkconfig.nodeXX
; (from sdkconfig.defaults) and its own .pio build dir.

[env]
platform = espressif32
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv ; default table caps app at 1MB; WiFi+MQTT needs more (see partitions.csv)
monitor_speed = 921600
build_flags =
    -D CONFIG_LOG_DEFAULT_LEVEL=3 ; ensures info level logs are printed (LEVELS: 0=NONE, 1=ERROR, 2=WARN, 3=INFO, 4=DEBUG, 5=VERBOSE)
monitor_filters = esp32_exception_decoder ; if code ever crashes, auto decode the stack trace to human readable form

[env:node01]
build_flags = ${env.build_flags} -D NODE_CONFIG_FILE=\"node_config_01.h\"
upload_port = COM3
monitor_port = COM3

[env:node02]
build_flags = ${env.build_flags} -D NODE_CONFIG_FILE=\"node_config_02.h\"
upload_port = COM3
monitor_port = COM3
; upload/monitor port auto-detected; pin like node01 once known
