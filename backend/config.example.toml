# Copy to config.toml and fill in real values. config.toml is gitignored
# (same pattern as doorway-node/src/net/secrets.h.example).

[mqtt]
host = "192.168.1.50"        # Pi 5 running mosquitto
port = 1883
username = "backend"          # mosquitto user created in Phase 3
password = "CHANGE-ME"
# Stable client id is REQUIRED: the broker queues QoS1 events for this id
# while the backend is down (persistent session = backend half of
# store-and-forward). Changing it abandons the queued session.
client_id = "backend"

[server]
host = "0.0.0.0"
port = 8000

[storage]
db_path = "occupancy.db"      # relative paths resolve against backend/
floorplan_path = "floorplan.json"
