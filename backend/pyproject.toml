[project]
name = "occupancy-backend"
version = "0.1.0"
description = "House occupancy backend: MQTT ingest, occupancy model, WebSocket digital-twin feed"
requires-python = ">=3.11"  # Pi 5 Bookworm ships 3.11; tomllib needs >=3.11
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiomqtt>=2.4,<3",  # 3.x is still alpha on PyPI; 2.x API (messages property, manual reconnect)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
